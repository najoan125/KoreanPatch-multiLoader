name: Minecraft Mod GUI Test (Windows RDP)

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Test target'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - windows-x64
          - windows-arm64

env:
  RDP_PASSWORD: ${{ secrets.RDP_PASSWORD || 'MCTestPass123!' }}

jobs:
  # ──────────────────────────────────────────
  # Windows x64 — Fully automated
  # ──────────────────────────────────────────
  test-windows-x64:
    if: ${{ inputs.architecture == 'both' || inputs.architecture == 'windows-x64' }}
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable RDP and set password
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0

          $admin = Get-LocalUser -Name "runneradmin"
          $securePwd = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $securePwd
          Enable-LocalUser -Name "runneradmin"

          Write-Host "RDP enabled for user: runneradmin"

      - name: Start ngrok RDP tunnel
        run: |
          choco install ngrok -y --no-progress
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          Start-Process ngrok -ArgumentList "tcp 3389" -WindowStyle Hidden
          Start-Sleep 8

          $tunnels = Invoke-RestMethod -Uri http://127.0.0.1:4040/api/tunnels -TimeoutSec 10
          $tcpTunnel = $tunnels.tunnels | Where-Object { $_.proto -eq "tcp" } | Select-Object -First 1
          $publicUrl = $tcpTunnel.public_url

          $hostPort = $publicUrl -replace "tcp://", ""
          $rdpHost = $hostPort.Split(":")[0]
          $rdpPort = $hostPort.Split(":")[1]

          Write-Host ""
          Write-Host "========================================"
          Write-Host "RDP x64 — CONNECT WITH YOUR PHONE"
          Write-Host "========================================"
          Write-Host "Host: $rdpHost"
          Write-Host "Port: $rdpPort"
          Write-Host "User: runneradmin"
          Write-Host "Pass: $env:RDP_PASSWORD"
          Write-Host "========================================"
          Write-Host ""

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Windows x64 — RDP Connection"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Item | Value |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "|------|-------|"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Host | ``$rdpHost`` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Port | ``$rdpPort`` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| User | ``runneradmin`` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Pass | ``$env:RDP_PASSWORD`` |"

      - name: Start Minecraft in RDP session and stream logs
        run: |
          Write-Host "Waiting for RDP session..."
          Write-Host "Connect from your phone now."
          Write-Host ""

          $maxWait = 600
          $elapsed = 0
          $sessionId = $null

          while ($elapsed -lt $maxWait) {
            $allSessions = query session 2>$null
            $found = $false

            foreach ($line in $allSessions) {
              Write-Host "  [SESSION] $line"
              if ($line -match "\s+console\s+" -or $line -match "^\s*services\s") { continue }
              if ($line -match "rdp-tcp#\d+.*runneradmin\s+(\d+)\s+(Active|Disc)") {
                $sessionId = $matches[1]
                Write-Host "RDP session found! ID: $sessionId"
                $found = $true
                break
              }
            }

            if ($found) { break }
            Start-Sleep 5
            $elapsed += 5
            if ($elapsed % 30 -eq 0) {
              Write-Host "Still waiting... ($elapsed s)"
            }
          }

          if (-not $sessionId) {
            Write-Error "Timeout: No RDP session within 10 minutes."
            exit 1
          }

          Invoke-WebRequest -Uri "https://download.sysinternals.com/files/PSTools.zip" -OutFile "$env:TEMP\PSTools.zip"
          Expand-Archive -Path "$env:TEMP\PSTools.zip" -DestinationPath "$env:TEMP" -Force

          $projectDir = "$pwd"
          $logPath = "$env:TEMP\minecraft-x64.log"

          $psScript = "$env:TEMP\run_minecraft.ps1"
          $psContent = "cd `"$projectDir`"`n./gradlew :fabric:runClient 2>&1 | Tee-Object -FilePath `"$logPath`""
          Set-Content -Path $psScript -Value $psContent -Encoding ASCII

          $proc = Start-Process -FilePath "$env:TEMP\PsExec.exe" -ArgumentList @(
            "-accepteula", "-i", $sessionId,
            "-u", "runneradmin", "-p", $env:RDP_PASSWORD,
            "powershell.exe", "-ExecutionPolicy", "Bypass", "-File", $psScript
          ) -WindowStyle Hidden -PassThru

          Write-Host ":fabric:runClient launched (PID: $($proc.Id))"

          $logFile = "$env:TEMP\minecraft-x64.log"
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Minecraft log streaming (x64)"
          Write-Host "========================================"

          $timeout = 120
          $waited = 0
          while (-not (Test-Path $logFile) -and $waited -lt $timeout) {
            Start-Sleep 3
            $waited += 3
            Write-Host "Waiting for log file... (${waited}s)"
          }

          if (-not (Test-Path $logFile)) {
            Write-Error "Log file not created after ${timeout}s"
            exit 1
          }

          $linesRead = 0
          while (-not $proc.HasExited) {
            $allLines = @(Get-Content $logFile)
            for ($i = $linesRead; $i -lt $allLines.Count; $i++) {
              Write-Host $allLines[$i]
            }
            $linesRead = $allLines.Count
            Start-Sleep 1
          }

          $allLines = @(Get-Content $logFile)
          for ($i = $linesRead; $i -lt $allLines.Count; $i++) {
            Write-Host $allLines[$i]
          }

          Write-Host ""
          Write-Host "Minecraft exited with code: $($proc.ExitCode)"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-log-windows-x64
          path: ${{ env.TEMP }}\minecraft-x64.log
          if-no-files-found: ignore

  # ──────────────────────────────────────────
  # Windows arm64 — MANUAL MODE
  # GitHub-hosted ARM64 runners lack GPU/OpenGL.
  # You must manually install the compatibility pack via RDP.
  # ──────────────────────────────────────────
  test-windows-arm64:
    if: ${{ inputs.architecture == 'both' || inputs.architecture == 'windows-arm64' }}
    runs-on: windows-11-arm
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: aarch64
          cache: gradle

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable RDP and set password
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0

          $admin = Get-LocalUser -Name "runneradmin"
          $securePwd = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $securePwd
          Enable-LocalUser -Name "runneradmin"

      - name: Start ngrok RDP tunnel
        run: |
          choco install ngrok -y --no-progress
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          Start-Process ngrok -ArgumentList "tcp 3389" -WindowStyle Hidden
          Start-Sleep 8

          $tunnels = Invoke-RestMethod -Uri http://127.0.0.1:4040/api/tunnels -TimeoutSec 10
          $tcpTunnel = $tunnels.tunnels | Where-Object { $_.proto -eq "tcp" } | Select-Object -First 1
          $publicUrl = $tcpTunnel.public_url

          $hostPort = $publicUrl -replace "tcp://", ""
          $rdpHost = $hostPort.Split(":")[0]
          $rdpPort = $hostPort.Split(":")[1]

          Write-Host "========================================"
          Write-Host "RDP ARM64 — CONNECT WITH YOUR PHONE"
          Write-Host "========================================"
          Write-Host "Host: $rdpHost"
          Write-Host "Port: $rdpPort"
          Write-Host "User: runneradmin"
          Write-Host "Pass: $env:RDP_PASSWORD"
          Write-Host "========================================"

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Windows ARM64 — RDP Connection"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Item | Value |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "|------|-------|"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Host | ``$rdpHost`` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Port | ``$rdpPort`` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| User | ``runneradmin`` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Pass | ``$env:RDP_PASSWORD`` |"

      - name: Start Minecraft in RDP session with pause (ARM64)
        run: |
          Write-Host "Waiting for RDP session..."
          Write-Host "Connect from your phone now."
          Write-Host ""

          $maxWait = 600
          $elapsed = 0
          $sessionId = $null

          while ($elapsed -lt $maxWait) {
            $allSessions = query session 2>$null
            $found = $false

            foreach ($line in $allSessions) {
              Write-Host "  [SESSION] $line"
              if ($line -match "\s+console\s+" -or $line -match "^\s*services\s") { continue }
              if ($line -match "rdp-tcp#\d+.*runneradmin\s+(\d+)\s+(Active|Disc)") {
                $sessionId = $matches[1]
                Write-Host "RDP session found! ID: $sessionId"
                $found = $true
                break
              }
            }

            if ($found) { break }
            Start-Sleep 5
            $elapsed += 5
            if ($elapsed % 30 -eq 0) {
              Write-Host "Still waiting... ($elapsed s)"
            }
          }

          if (-not $sessionId) {
            Write-Error "Timeout: No RDP session within 10 minutes."
            exit 1
          }

          Invoke-WebRequest -Uri "https://download.sysinternals.com/files/PSTools.zip" -OutFile "$env:TEMP\PSTools.zip"
          Expand-Archive -Path "$env:TEMP\PSTools.zip" -DestinationPath "$env:TEMP" -Force

          $projectDir = "$pwd"
          $logPath = "$env:TEMP\minecraft-arm64.log"

          # Create batch file with PAUSE — user installs compatibility pack, then presses any key
          $batchPath = "$env:TEMP\run_minecraft_arm64.bat"
          $lines = @(
            '@echo off',
            'chcp 65001 >nul',
            'echo ========================================',
            'echo [ARM64] OpenGL compatibility pack required',
            'echo ========================================',
            'echo Browser will open to store.rg-adguard.net',
            'echo [1] Enter Product ID: 9NQPSL29BFFF',
            'echo [2] Download the .msixbundle file',
            'echo [3] Install it (double-click to install)',
            'echo [4] Return here and press ANY KEY to continue',
            'echo ========================================',
            'start "" "https://store.rg-adguard.net"',
            'pause',
            "cd /d `"$projectDir`"",
            "powershell -Command `".\gradlew :fabric:runClient 2>&1 | Tee-Object -FilePath '$logPath'`""
          )
          $lines | Set-Content -Path $batchPath -Encoding ASCII

          Write-Host "Created batch file with PAUSE: $batchPath"

          # Launch batch in RDP session — the window shows pause prompt
          # NOTE: start /wait blocks until gradlew fully exits
          $proc = Start-Process -FilePath "$env:TEMP\PsExec.exe" -ArgumentList @(
            "-accepteula", "-i", $sessionId,
            "-u", "runneradmin", "-p", $env:RDP_PASSWORD,
            "cmd.exe", "/c", "start", "/wait", "", $batchPath
          ) -WindowStyle Hidden -PassThru

          Write-Host "Batch launched in RDP session $sessionId"
          Write-Host "A visible CMD window is showing the pause prompt on the RDP desktop."

          # Stream log in Actions console
          $logFile = "$env:TEMP\minecraft-arm64.log"
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Minecraft log streaming (ARM64)"
          Write-Host "========================================"

          $timeout = 600
          $waited = 0
          while (-not (Test-Path $logFile) -and $waited -lt $timeout) {
            Start-Sleep 3
            $waited += 3
            if ($waited % 30 -eq 0) {
              Write-Host "Waiting for you to press any key on RDP desktop... (${waited}s)"
            }
          }

          if (-not (Test-Path $logFile)) {
            Write-Error "Log file not created — compatibility pack may not be installed"
            exit 1
          }

          $linesRead = 0
          while (-not $proc.HasExited) {
            $allLines = @(Get-Content $logFile)
            for ($i = $linesRead; $i -lt $allLines.Count; $i++) {
              Write-Host $allLines[$i]
            }
            $linesRead = $allLines.Count
            Start-Sleep 1
          }

          $allLines = @(Get-Content $logFile)
          for ($i = $linesRead; $i -lt $allLines.Count; $i++) {
            Write-Host $allLines[$i]
          }

          Write-Host ""
          Write-Host "Minecraft exited with code: $($proc.ExitCode)"
