name: Minecraft Mod GUI Test (Windows RDP)

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Test target'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - windows-x64
          - windows-arm64

env:
  # Change this before running if you want
  RDP_PASSWORD: ${{ secrets.RDP_PASSWORD || 'MCTestPass123!' }}

jobs:
  # ──────────────────────────────────────────
  # Windows x64 — RDP 세션 생성 후 GUI 실행
  # ──────────────────────────────────────────
  test-windows-x64:
    if: ${{ inputs.architecture == 'both' || inputs.architecture == 'windows-x64' }}
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v6

      # ── 1. RDP 활성화 + 계정 설정 ──
      - name: Enable RDP and set password
        run: |
          # Enable RDP
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0

          # Set runneradmin password for RDP login
          $admin = Get-LocalUser -Name "runneradmin"
          $securePwd = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $securePwd
          Enable-LocalUser -Name "runneradmin"

          Write-Host "RDP enabled for user: runneradmin"

      # ── 2. ngrok로 RDP 포트(3389) 터널링 ──
      - name: Start ngrok RDP tunnel
        run: |
          choco install ngrok -y --no-progress
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          # Tunnel RDP port 3389
          Start-Process ngrok -ArgumentList "tcp 3389" -WindowStyle Hidden
          Start-Sleep 8

          # Get public endpoint
          $tunnels = Invoke-RestMethod -Uri http://127.0.0.1:4040/api/tunnels -TimeoutSec 10
          $tcpTunnel = $tunnels.tunnels | Where-Object { $_.proto -eq "tcp" } | Select-Object -First 1
          $publicUrl = $tcpTunnel.public_url  # tcp://x.tcp.ngrok.io:xxxxx

          # Parse host and port
          $hostPort = $publicUrl -replace "tcp://", ""
          $rdpHost = $hostPort.Split(":")[0]
          $rdpPort = $hostPort.Split(":")[1]

          Write-Host ""
          Write-Host "========================================"
          Write-Host "RDP CONNECT WITH YOUR PHONE NOW"
          Write-Host "========================================"
          Write-Host "Host: $rdpHost"
          Write-Host "Port: $rdpPort"
          Write-Host "User: runneradmin"
          Write-Host "Pass: $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "[Android] Microsoft Remote Desktop app"
          Write-Host "[iOS]     Microsoft Remote Desktop app"
          Write-Host ""
          Write-Host "STEPS:"
          Write-Host "  1. Open the app on your phone"
          Write-Host "  2. Add PC -> Host: $rdpHost:$rdpPort"
          Write-Host "  3. User: runneradmin / Pass: $env:RDP_PASSWORD"
          Write-Host "  4. Connect -> see desktop -> DISCONNECT (keep session)"
          Write-Host "  5. Minecraft will start automatically after disconnect"
          Write-Host "========================================"
          Write-Host ""

          # Also write to job summary for web view
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Windows x64 — RDP Connection Info"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Item | Value |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "|------|-------|"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Host | ``$rdpHost`` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Port | ``$rdpPort`` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| User | ``runneradmin`` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Pass | ``$env:RDP_PASSWORD`` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| App  | Microsoft Remote Desktop (Android/iOS) |"

      # ── 3. RDP 세션 생성 대기 (휴드폰으로 접속 + disconnect 할 때까지) ──
      - name: Wait for RDP session (connect from phone, then disconnect)
        run: |
          Write-Host "Waiting for RDP session to be created..."
          Write-Host "(Connect from your phone now, then disconnect to keep session alive)"
          Write-Host ""

          $maxWait = 600  # 10 minutes to connect from phone
          $elapsed = 0
          while ($elapsed -lt $maxWait) {
            # Check if any RDP session exists (active or disconnected)
            $sessions = query session 2>$null
            $hasSession = $sessions | Select-String "runneradmin"

            if ($hasSession) {
              Write-Host "RDP session detected! Waiting 15s for disconnect..."
              Start-Sleep 15

              # Check if session is still active (connected)
              $activeSession = (query session) | Select-String "runneradmin.*Active"
              if (-not $activeSession) {
                Write-Host "RDP session is disconnected (session kept alive). Proceeding..."
                break
              }
              Write-Host "Session still active. Disconnect from phone to proceed."
            }

            Start-Sleep 5
            $elapsed += 5
            if ($elapsed % 30 -eq 0) {
              Write-Host "Still waiting... ($elapsed s elapsed, $(600-$elapsed)s remaining)"
            }
          }

          if ($elapsed -ge $maxWait) {
            Write-Error "Timeout: No RDP session detected within 10 minutes."
            exit 1
          }

      # ── 4. 대화형 세션에서 Minecraft 실행 ──
      - name: Run :fabric:runClient in RDP session
        run: |
          # Find the active session ID for runneradmin
          $sessionInfo = query session | Select-String "runneradmin"
          $sessionId = ($sessionInfo -split "\s+")[2]
          Write-Host "Target session ID: $sessionId"

          # Use PsExec to run in the RDP session
          Invoke-WebRequest -Uri "https://download.sysinternals.com/files/PSTools.zip" -OutFile "$env:TEMP\PSTools.zip"
          Expand-Archive -Path "$env:TEMP\PSTools.zip" -DestinationPath "$env:TEMP" -Force

          # Run gradle in the RDP session, log to file
          $gradleCmd = "cd `"$pwd`"; .\gradlew :fabric:runClient 2>&1 | Tee-Object '$env:TEMP\minecraft-x64.log'"
          Start-Process -FilePath "$env:TEMP\PsExec.exe" `
            -ArgumentList @("-accepteula", "-i", $sessionId, "-u", "runneradmin", "-p", $env:RDP_PASSWORD, "powershell.exe", "-Command", $gradleCmd) `
            -WindowStyle Hidden

          Write-Host ":fabric:runClient started in RDP session $sessionId"

      # ── 5. 로그 스트리밍 ──
      - name: Stream Minecraft log
        run: |
          $logFile = "$env:TEMP\minecraft-x64.log"
          $timeout = 120
          $elapsed = 0

          while (-not (Test-Path $logFile) -and $elapsed -lt $timeout) {
            Start-Sleep 5
            $elapsed += 5
            Write-Host "Waiting for log file... ($elapsed s)"
          }

          if (-not (Test-Path $logFile)) {
            Write-Error "Log file not created"
            exit 1
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Minecraft log streaming (x64)"
          Write-Host "========================================"

          $reader = [System.IO.StreamReader]::new($logFile)
          try {
            while ($true) {
              $line = $reader.ReadLine()
              if ($line -ne $null) {
                Write-Host $line
              } else {
                Start-Sleep 1
              }
            }
          } finally {
            $reader.Close()
          }

      # ── 6. Keep alive ──
      - name: Keep alive until manually cancelled
        run: |
          Write-Host ""
          Write-Host "Minecraft is running. Click 'Cancel workflow' to stop."
          Write-Host ""
          $min = 0
          $logFile = "$env:TEMP\minecraft-x64.log"
          while ($true) {
            Start-Sleep 60
            $min++
            Write-Host "[KEEP-ALIVE x64] ${min} min..."
            if (Test-Path $logFile) {
              Get-Content $logFile -Tail 3 | ForEach-Object { Write-Host "  [LOG] $_" }
            }
          }

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-log-windows-x64
          path: ${{ env.TEMP }}\minecraft-x64.log
          if-no-files-found: ignore

  # ──────────────────────────────────────────
  # Windows arm64 — RDP 세션 생성 후 GUI 실행
  # windows-11-arm runner 사용 (Preview)
  # ──────────────────────────────────────────
  test-windows-arm64:
    if: ${{ inputs.architecture == 'both' || inputs.architecture == 'windows-arm64' }}
    runs-on: windows-11-arm
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          architecture: aarch64
          cache: gradle

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable RDP and set password
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0

          $admin = Get-LocalUser -Name "runneradmin"
          $securePwd = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $securePwd
          Enable-LocalUser -Name "runneradmin"

      - name: Start ngrok RDP tunnel
        run: |
          choco install ngrok -y --no-progress
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          Start-Process ngrok -ArgumentList "tcp 3389" -WindowStyle Hidden
          Start-Sleep 8

          $tunnels = Invoke-RestMethod -Uri http://127.0.0.1:4040/api/tunnels -TimeoutSec 10
          $tcpTunnel = $tunnels.tunnels | Where-Object { $_.proto -eq "tcp" } | Select-Object -First 1
          $publicUrl = $tcpTunnel.public_url
          $hostPort = $publicUrl -replace "tcp://", ""
          $rdpHost = $hostPort.Split(":")[0]
          $rdpPort = $hostPort.Split(":")[1]

          Write-Host "========================================"
          Write-Host "RDP ARM64 — CONNECT WITH YOUR PHONE"
          Write-Host "========================================"
          Write-Host "Host: $rdpHost"
          Write-Host "Port: $rdpPort"
          Write-Host "User: runneradmin"
          Write-Host "Pass: $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "Steps: Connect -> see desktop -> DISCONNECT -> auto start"
          Write-Host "========================================"

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Windows ARM64 — RDP Connection Info"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Item | Value |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "|------|-------|"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Host | ``$rdpHost`` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Port | ``$rdpPort`` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| User | ``runneradmin`` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Pass | ``$env:RDP_PASSWORD`` |"

      - name: Wait for RDP session
        run: |
          Write-Host "Waiting for RDP session... (connect from phone, then disconnect)"
          $maxWait = 600
          $elapsed = 0
          while ($elapsed -lt $maxWait) {
            $sessions = query session 2>$null
            $hasSession = $sessions | Select-String "runneradmin"
            if ($hasSession) {
              Write-Host "Session detected! Waiting 15s for disconnect..."
              Start-Sleep 15
              $activeSession = (query session) | Select-String "runneradmin.*Active"
              if (-not $activeSession) {
                Write-Host "Session disconnected. Proceeding..."
                break
              }
            }
            Start-Sleep 5
            $elapsed += 5
          }
          if ($elapsed -ge $maxWait) {
            Write-Error "Timeout waiting for RDP session"
            exit 1
          }

      - name: Run :fabric:runClient in RDP session
        run: |
          $sessionInfo = query session | Select-String "runneradmin"
          $sessionId = ($sessionInfo -split "\s+")[2]

          Invoke-WebRequest -Uri "https://download.sysinternals.com/files/PSTools.zip" -OutFile "$env:TEMP\PSTools.zip"
          Expand-Archive -Path "$env:TEMP\PSTools.zip" -DestinationPath "$env:TEMP" -Force

          $gradleCmd = "cd `"$pwd`"; .\gradlew :fabric:runClient 2>&1 | Tee-Object '$env:TEMP\minecraft-arm64.log'"
          Start-Process -FilePath "$env:TEMP\PsExec.exe" `
            -ArgumentList @("-accepteula", "-i", $sessionId, "-u", "runneradmin", "-p", $env:RDP_PASSWORD, "powershell.exe", "-Command", $gradleCmd) `
            -WindowStyle Hidden

          Write-Host ":fabric:runClient started in RDP session $sessionId"

      - name: Stream Minecraft log
        run: |
          $logFile = "$env:TEMP\minecraft-arm64.log"
          $timeout = 120
          $elapsed = 0
          while (-not (Test-Path $logFile) -and $elapsed -lt $timeout) {
            Start-Sleep 5
            $elapsed += 5
            Write-Host "Waiting for log file... ($elapsed s)"
          }
          if (-not (Test-Path $logFile)) {
            Write-Error "Log file not created"
            exit 1
          }
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Minecraft log streaming (ARM64)"
          Write-Host "========================================"
          $reader = [System.IO.StreamReader]::new($logFile)
          try {
            while ($true) {
              $line = $reader.ReadLine()
              if ($line -ne $null) {
                Write-Host $line
              } else {
                Start-Sleep 1
              }
            }
          } finally {
            $reader.Close()
          }

      - name: Keep alive until manually cancelled
        run: |
          Write-Host ""
          Write-Host "Minecraft is running. Click 'Cancel workflow' to stop."
          Write-Host ""
          $min = 0
          $logFile = "$env:TEMP\minecraft-arm64.log"
          while ($true) {
            Start-Sleep 60
            $min++
            Write-Host "[KEEP-ALIVE ARM64] ${min} min..."
            if (Test-Path $logFile) {
              Get-Content $logFile -Tail 3 | ForEach-Object { Write-Host "  [LOG] $_" }
            }
          }

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-log-windows-arm64
          path: ${{ env.TEMP }}\minecraft-arm64.log
          if-no-files-found: ignore
