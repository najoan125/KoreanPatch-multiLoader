name: Minecraft Mod GUI Test (Windows RDP)

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Test target'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - windows-x64
          - windows-arm64

env:
  # Change this before running if you want
  RDP_PASSWORD: ${{ secrets.RDP_PASSWORD || 'MCTestPass123!' }}

jobs:
  # ──────────────────────────────────────────
  # Windows x64 — RDP 세션 생성 후 GUI 실행
  # ──────────────────────────────────────────
  test-windows-x64:
    if: ${{ inputs.architecture == 'both' || inputs.architecture == 'windows-x64' }}
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v6

      # ── 1. RDP 활성화 + 계정 설정 ──
      - name: Enable RDP and set password
        run: |
          # Enable RDP
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0

          # Set runneradmin password for RDP login
          $admin = Get-LocalUser -Name "runneradmin"
          $securePwd = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $securePwd
          Enable-LocalUser -Name "runneradmin"

          Write-Host "RDP enabled for user: runneradmin"

      # ── 2. ngrok로 RDP 포트(3389) 터널링 ──
      - name: Start ngrok RDP tunnel
        run: |
          choco install ngrok -y --no-progress
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          # Tunnel RDP port 3389
          Start-Process ngrok -ArgumentList "tcp 3389" -WindowStyle Hidden
          Start-Sleep 8

          # Get public endpoint
          $tunnels = Invoke-RestMethod -Uri http://127.0.0.1:4040/api/tunnels -TimeoutSec 10
          $tcpTunnel = $tunnels.tunnels | Where-Object { $_.proto -eq "tcp" } | Select-Object -First 1
          $publicUrl = $tcpTunnel.public_url  # tcp://x.tcp.ngrok.io:xxxxx

          # Parse host and port
          $hostPort = $publicUrl -replace "tcp://", ""
          $rdpHost = $hostPort.Split(":")[0]
          $rdpPort = $hostPort.Split(":")[1]

          Write-Host ""
          Write-Host "========================================"
          Write-Host "RDP CONNECT WITH YOUR PHONE NOW"
          Write-Host "========================================"
          Write-Host "Host: $rdpHost"
          Write-Host "Port: $rdpPort"
          Write-Host "User: runneradmin"
          Write-Host "Pass: $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "[Android] Microsoft Remote Desktop app"
          Write-Host "[iOS]     Microsoft Remote Desktop app"
          Write-Host ""
          Write-Host "STEPS:"
          Write-Host "  1. Open the app on your phone"
          Write-Host "  2. Add PC -> Host: $rdpHost:$rdpPort"
          Write-Host "  3. User: runneradmin / Pass: $env:RDP_PASSWORD"
          Write-Host "  4. Connect -> see desktop -> DISCONNECT (keep session)"
          Write-Host "  5. Minecraft will start automatically after disconnect"
          Write-Host "========================================"
          Write-Host ""

          # Also write to job summary for web view
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Windows x64 — RDP Connection Info"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Item | Value |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "|------|-------|"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Host | ``$rdpHost`` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Port | ``$rdpPort`` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| User | ``runneradmin`` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Pass | ``$env:RDP_PASSWORD`` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| App  | Microsoft Remote Desktop (Android/iOS) |"

      # ── 3. RDP 세션 대기 + 배치파일 실행 + 로그 스트리밍 (한 step) ──
      - name: Start Minecraft in RDP session and stream logs
        run: |
          Write-Host "Waiting for RDP session..."
          Write-Host "Connect from your phone now."
          Write-Host ""

          $maxWait = 600
          $elapsed = 0
          $sessionId = $null

          while ($elapsed -lt $maxWait) {
            $allSessions = query session 2>$null
            $found = $false

            foreach ($line in $allSessions) {
              Write-Host "  [SESSION] $line"
              if ($line -match "\s+console\s+" -or $line -match "^\s*services\s") { continue }
              if ($line -match "rdp-tcp#\d+.*runneradmin\s+(\d+)\s+(Active|Disc)") {
                $sessionId = $matches[1]
                Write-Host "RDP session found! ID: $sessionId"
                $found = $true
                break
              }
            }

            if ($found) { break }
            Start-Sleep 5
            $elapsed += 5
            if ($elapsed % 30 -eq 0) {
              Write-Host "Still waiting... ($elapsed s)"
            }
          }

          if (-not $sessionId) {
            Write-Error "Timeout: No RDP session within 10 minutes."
            exit 1
          }

          # Download PsExec
          Invoke-WebRequest -Uri "https://download.sysinternals.com/files/PSTools.zip" -OutFile "$env:TEMP\PSTools.zip"
          Expand-Archive -Path "$env:TEMP\PSTools.zip" -DestinationPath "$env:TEMP" -Force

          # Create batch file — runs gradle with output redirected to log file
          $batchPath = "$env:TEMP\run_minecraft.bat"
          $projectDir = "$pwd"
          $logPath = "$env:TEMP\minecraft-x64.log"
          # Use PowerShell with Tee-Object: shows on screen AND saves to file
          $psScript = "$env:TEMP\run_minecraft.ps1"
          $psContent = "cd `"$projectDir`"`n./gradlew :fabric:runClient 2>&1 | Tee-Object -FilePath `"$logPath`""
          Set-Content -Path $psScript -Value $psContent -Encoding ASCII
          Write-Host "Created PowerShell script: $psScript"

          # Launch PowerShell script in RDP session via PsExec
          $proc = Start-Process -FilePath "$env:TEMP\PsExec.exe" -ArgumentList @(
            "-accepteula", "-i", $sessionId,
            "-u", "runneradmin", "-p", $env:RDP_PASSWORD,
            "powershell.exe", "-ExecutionPolicy", "Bypass", "-File", $psScript
          ) -WindowStyle Hidden -PassThru

          Write-Host ":fabric:runClient launched in RDP session $sessionId (PID: $($proc.Id))"

          # Stream log file in real-time
          $logFile = "$env:TEMP\minecraft-x64.log"
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Minecraft log streaming (x64)"
          Write-Host "========================================"

          # Wait for log file
          $timeout = 120
          $waited = 0
          while (-not (Test-Path $logFile) -and $waited -lt $timeout) {
            Start-Sleep 3
            $waited += 3
            Write-Host "Waiting for log file... (${waited}s)"
          }

          if (-not (Test-Path $logFile)) {
            Write-Error "Log file not created after ${timeout}s"
            exit 1
          }

          # Stream log while process is running (exits automatically when gradle finishes)
          $linesRead = 0
          while (-not $proc.HasExited) {
            $allLines = @(Get-Content $logFile)
            for ($i = $linesRead; $i -lt $allLines.Count; $i++) {
              Write-Host $allLines[$i]
            }
            $linesRead = $allLines.Count
            Start-Sleep 1
          }

          # Final flush after process exits
          $allLines = @(Get-Content $logFile)
          for ($i = $linesRead; $i -lt $allLines.Count; $i++) {
            Write-Host $allLines[$i]
          }

          Write-Host ""
          Write-Host "Minecraft process exited with code: $($proc.ExitCode)"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-log-windows-x64
          path: ${{ env.TEMP }}\minecraft-x64.log
          if-no-files-found: ignore

  # ──────────────────────────────────────────
  # Windows arm64 — RDP 세션 생성 후 GUI 실행
  # windows-11-arm runner 사용 (Preview)
  # ──────────────────────────────────────────
  test-windows-arm64:
    if: ${{ inputs.architecture == 'both' || inputs.architecture == 'windows-arm64' }}
    runs-on: windows-11-arm
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: aarch64
          cache: gradle

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable RDP and set password
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0

          $admin = Get-LocalUser -Name "runneradmin"
          $securePwd = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $securePwd
          Enable-LocalUser -Name "runneradmin"

      - name: Start ngrok RDP tunnel
        run: |
          choco install ngrok -y --no-progress
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          Start-Process ngrok -ArgumentList "tcp 3389" -WindowStyle Hidden
          Start-Sleep 8

          $tunnels = Invoke-RestMethod -Uri http://127.0.0.1:4040/api/tunnels -TimeoutSec 10
          $tcpTunnel = $tunnels.tunnels | Where-Object { $_.proto -eq "tcp" } | Select-Object -First 1
          $publicUrl = $tcpTunnel.public_url
          $hostPort = $publicUrl -replace "tcp://", ""
          $rdpHost = $hostPort.Split(":")[0]
          $rdpPort = $hostPort.Split(":")[1]

          Write-Host "========================================"
          Write-Host "RDP ARM64 — CONNECT WITH YOUR PHONE"
          Write-Host "========================================"
          Write-Host "Host: $rdpHost"
          Write-Host "Port: $rdpPort"
          Write-Host "User: runneradmin"
          Write-Host "Pass: $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "Steps: Connect -> see desktop -> DISCONNECT -> auto start"
          Write-Host "========================================"

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Windows ARM64 — RDP Connection Info"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Item | Value |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "|------|-------|"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Host | ``$rdpHost`` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Port | ``$rdpPort`` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| User | ``runneradmin`` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Pass | ``$env:RDP_PASSWORD`` |"

      - name: Start Minecraft in RDP session and stream logs
        run: |
          Write-Host "Waiting for RDP session..."
          Write-Host "Connect from your phone now."
          Write-Host ""

          $maxWait = 600
          $elapsed = 0
          $sessionId = $null

          while ($elapsed -lt $maxWait) {
            $allSessions = query session 2>$null
            $found = $false

            foreach ($line in $allSessions) {
              Write-Host "  [SESSION] $line"
              if ($line -match "\s+console\s+" -or $line -match "^\s*services\s") { continue }
              if ($line -match "rdp-tcp#\d+.*runneradmin\s+(\d+)\s+(Active|Disc)") {
                $sessionId = $matches[1]
                Write-Host "RDP session found! ID: $sessionId"
                $found = $true
                break
              }
            }

            if ($found) { break }
            Start-Sleep 5
            $elapsed += 5
            if ($elapsed % 30 -eq 0) {
              Write-Host "Still waiting... ($elapsed s)"
            }
          }

          if (-not $sessionId) {
            Write-Error "Timeout: No RDP session within 10 minutes."
            exit 1
          }

          # Download PsExec
          Invoke-WebRequest -Uri "https://download.sysinternals.com/files/PSTools.zip" -OutFile "$env:TEMP\PSTools.zip"
          Expand-Archive -Path "$env:TEMP\PSTools.zip" -DestinationPath "$env:TEMP" -Force

          # Download Mesa3D ARM64 software OpenGL renderer
          # mmozeiko/build-mesa provides actual ARM64 binaries (pal1000 only has x86/x64)
          $mesaDir = "$env:TEMP\mesa-arm64"
          New-Item -ItemType Directory -Path $mesaDir -Force | Out-Null
          Write-Host "Downloading Mesa3D ARM64 llvmpipe..."
          Invoke-WebRequest -Uri "https://github.com/mmozeiko/build-mesa/releases/download/26.1.0/mesa-llvmpipe-arm64-26.1.0.7z" -OutFile "$env:TEMP\mesa-arm64.7z"
          choco install 7zip -y --no-progress
          & "C:\Program Files\7-Zip\7z.exe" x "$env:TEMP\mesa-arm64.7z" -o"$mesaDir" -y | Out-Null

          # Find the ARM64 opengl32.dll
          $mesaDll = "$mesaDir\opengl32.dll"
          if (-not (Test-Path $mesaDll)) {
            $found = Get-ChildItem -Path $mesaDir -Filter "opengl32.dll" -Recurse | Select-Object -First 1
            if ($found) { $mesaDll = $found.FullName }
          }

          $projectDir = "$pwd"
          $logPath = "$env:TEMP\minecraft-arm64.log"

          if (Test-Path $mesaDll) {
            Write-Host "Mesa3D ARM64 DLL found: $mesaDll"
            # Copy to project root — Windows loads opengl32.dll from app directory first
            Copy-Item -Path $mesaDll -Destination "$projectDir\opengl32.dll" -Force
            Write-Host "Copied opengl32.dll to project root"
          } else {
            Write-Warning "Mesa3D ARM64 DLL not found! OpenGL may fail."
          }

          # Create PowerShell script with Tee-Object (screen + file)
          $psScript = "$env:TEMP\run_minecraft_arm64.ps1"
          $psLines = @(
            "`$env:MESA_GL_VERSION_OVERRIDE='4.5'",
            "`$env:MESA_GLSL_VERSION_OVERRIDE='450'",
            "`$env:GALLIUM_DRIVER='llvmpipe'",
            "cd `"$projectDir`"",
            ".\gradlew :fabric:runClient 2>&1 | Tee-Object -FilePath `"$logPath`""
          )
          Set-Content -Path $psScript -Value ($psLines -join "`n") -Encoding ASCII
          Write-Host "Created PowerShell script: $psScript"

          # Launch PowerShell script in RDP session via PsExec
          $proc = Start-Process -FilePath "$env:TEMP\PsExec.exe" -ArgumentList @(
            "-accepteula", "-i", $sessionId,
            "-u", "runneradmin", "-p", $env:RDP_PASSWORD,
            "powershell.exe", "-ExecutionPolicy", "Bypass", "-File", $psScript
          ) -WindowStyle Hidden -PassThru

          Write-Host ":fabric:runClient launched in RDP session $sessionId (PID: $($proc.Id))"

          # Stream log
          $logFile = "$env:TEMP\minecraft-arm64.log"
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Minecraft log streaming (ARM64)"
          Write-Host "========================================"

          $timeout = 120
          $waited = 0
          while (-not (Test-Path $logFile) -and $waited -lt $timeout) {
            Start-Sleep 3
            $waited += 3
            Write-Host "Waiting for log file... (${waited}s)"
          }

          if (-not (Test-Path $logFile)) {
            Write-Error "Log file not created after ${timeout}s"
            exit 1
          }

          # Stream log while process is running (exits automatically when gradle finishes)
          $linesRead = 0
          while (-not $proc.HasExited) {
            $allLines = @(Get-Content $logFile)
            for ($i = $linesRead; $i -lt $allLines.Count; $i++) {
              Write-Host $allLines[$i]
            }
            $linesRead = $allLines.Count
            Start-Sleep 1
          }

          # Final flush after process exits
          $allLines = @(Get-Content $logFile)
          for ($i = $linesRead; $i -lt $allLines.Count; $i++) {
            Write-Host $allLines[$i]
          }

          Write-Host ""
          Write-Host "Minecraft process exited with code: $($proc.ExitCode)"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-log-windows-arm64
          path: ${{ env.TEMP }}\minecraft-arm64.log
          if-no-files-found: ignore
