plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    // 26.x ships deobfuscated, so no mappings are declared and mod dependencies
    // use the plain configurations instead of the remapping ones.
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    def addEmbeddedFabricModule = { String name ->
        def module = fabricApi.module(name, fabric_version)
        implementation module
        include module
    }
    addEmbeddedFabricModule "fabric-api-base"
    addEmbeddedFabricModule "fabric-key-mapping-api-v1"
    addEmbeddedFabricModule "fabric-lifecycle-events-v1"
    addEmbeddedFabricModule "fabric-resource-loader-v0"
    addEmbeddedFabricModule "fabric-resource-loader-v1"
    addEmbeddedFabricModule "fabric-screen-api-v1"

    api("me.shedaniel.cloth:cloth-config-fabric:${cloth_config}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
        exclude group: 'net.fabricmc.fabric-api', module: 'fabric-api'
    }
    compileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}-fabric"

    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
